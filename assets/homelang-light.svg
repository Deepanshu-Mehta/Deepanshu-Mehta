<text x="44" y="64" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" letter-spacing="1.5" fill="#59636e">COMPILER · VISUAL WALKTHROUGH</text>
<text x="43" y="118" font-size="46" font-weight="700" letter-spacing="-1" fill="#1f2328">HomeLang</text>
<text x="44" y="158" font-size="24" fill="#59636e">A complete compiler for a smart-home language, with</text>
<text x="44" y="189" font-size="24" fill="#59636e">every stage drawn from the data it runs on.</text>
<text x="44" y="246" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="23" fill="#1f2328"><tspan fill="#cf222e">IF</tspan> TEMPERATURE &gt; <tspan fill="#0550ae">30</tspan> <tspan fill="#cf222e">THEN</tspan> TURN_ON AC</text>
